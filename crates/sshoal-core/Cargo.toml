[package]
name = "sshoal-core"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_yaml = "0.9"
# Passphrase-based encryption for `--encrypt` exports: Argon2id KDF +
# XChaCha20-Poly1305 AEAD, both from RustCrypto (heavily maintained). We own only
# a small versioned envelope around them, not any crypto primitive.
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[dev-dependencies]
# `test-util` gives us paused virtual time so backoff/reconnect tests run instantly.
tokio = { version = "1", features = ["test-util", "macros", "rt", "time", "sync"] }
