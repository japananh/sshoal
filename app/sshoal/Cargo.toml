[package]
name = "sshoal"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sshoal"
path = "src/main.rs"

[dependencies]
sshoal-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Software (tiny-skia) renderer only — drops the wgpu/GPU stack for a much
# smaller binary and lower memory use; the tray UI doesn't need a GPU.
iced = { version = "0.14", default-features = false, features = [
    "tokio",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
tray-icon = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rpassword = "7.5.4"
resvg = "0.47.0"
global-hotkey = "0.8.0"
# Native open/save file dialogs for Export… / Import… in Preferences.
rfd = "0.15"

# macOS only: reach the tray's NSStatusBarButton to draw a native 2-line title
# (not capped at 18pt like the tray-icon image). objc2 versions match tray-icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSAttributedString",
    "NSArray",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSControl",
    "NSButton",
    "NSCell",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSWindow",
    "NSFont",
    "NSColor",
    "NSParagraphStyle",
    "NSText",
    "NSAttributedString",
] }
